<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Admin Panel</title>
    <link rel="stylesheet" href="admin.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    
    <script>MathJax = { tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] } };</script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body>
    <div class="container">
        
        <div id="view-dashboard">
            <h1 style="text-align:center; color:#3f37c9; margin-bottom:20px;">🎨 কুইজ ড্যাশবোর্ড</h1>
            
            <div class="header-actions">
                <h2 style="margin:0;">সকল কুইজ তালিকা</h2>
                <button onclick="createNewQuiz()" class="primary-btn">+ নতুন কুইজ তৈরি করুন</button>
            </div>

            <input type="text" id="search-quiz" placeholder="🔍 কুইজের নাম দিয়ে খুঁজুন..." onkeyup="filterQuizzes()" style="padding:12px; border:2px solid #e0e0e0; border-radius:25px; padding-left:20px; width:100%; margin-bottom:20px; outline:none;">

            <div id="quiz-list-container">Loading...</div>
        </div>

        <div id="view-editor" style="display:none;">
            <div class="editor-header">
                <button onclick="showDashboard()" class="secondary-btn">← ড্যাশবোর্ডে ফিরে যান</button>
                <h2 style="margin:0; color:#333;">কুইজ এডিটর</h2>
                <button onclick="saveQuiz()" class="success-btn">💾 সেভ কুইজ</button>
            </div>

            <div class="settings-panel">
                <div class="input-group">
                    <label>কুইজের নাম</label>
                    <input type="text" id="quiz-title-input" placeholder="Ex: Weekly General Knowledge Test">
                </div>
                <div class="settings-grid">
                    <div class="input-group">
                        <label>সময় (মিনিট)</label>
                        <input type="number" id="quiz-duration" value="60">
                    </div>
                    <div class="input-group">
                        <label>পাস মার্ক</label>
                        <input type="number" id="quiz-pass-mark" value="30">
                    </div>
                    <div class="input-group">
                        <label>প্রতি সঠিক উত্তর (+)</label>
                        <input type="number" id="quiz-pos-mark" value="1">
                    </div>
                    <div class="input-group">
                        <label>প্রতি ভুল উত্তর (-)</label>
                        <input type="number" id="quiz-neg-mark" value="0.25">
                    </div>
                </div>
                <div class="checkbox-group" style="margin-top:10px;">
                    <label style="display:flex; align-items:center; gap:5px; cursor:pointer;">
                        <input type="checkbox" id="rand-question-check"> প্রশ্ন র‍্যান্ডমাইজ (Randomize Questions)
                    </label>
                    <label style="display:flex; align-items:center; gap:5px; cursor:pointer;">
                        <input type="checkbox" id="rand-option-check"> অপশন র‍্যান্ডমাইজ (Randomize Options)
                    </label>
                </div>
            </div>

            <div class="editor-layout">
                <div class="editor-left">
                    <h3>📥 প্রশ্ন যোগ করুন (Bulk Add)</h3>
                    
                    <div class="input-group" style="margin-bottom: 10px; background: #e3f2fd; padding: 10px; border-radius: 5px; border: 1px solid #90caf9;">
                        <label style="font-weight:bold; color:#1565c0;">📂 বর্তমান সেকশন (Subject Name):</label>
                        <input type="text" id="current-section-name" value="General Knowledge" placeholder="Ex: Math, English, GK" style="width:100%; padding:8px; margin-top:5px; border:1px solid #ccc; border-radius:4px;">
                        <small style="color:#666; display:block; margin-top:5px;">Note: নিচের বক্সে প্রশ্ন পেস্ট করার আগে এখানে সেকশনের নাম লিখুন।</small>
                    </div>

                    <textarea id="bulk-text" placeholder="Paste your questions here...&#10;&#10;Question line&#10;Option 1&#10;Option 2&#10;Answer: Option 1" style="height:300px;"></textarea>
                    
                    <div class="bulk-actions">
                        <button onclick="processBulk()" class="primary-btn" style="background:#9c27b0; color:white; width:100%; margin-top:5px;">⚡ বাল্ক প্রসেস (Add to Section)</button>
                    </div>
                </div>

                <div class="editor-right">
                    <div class="preview-section" style="height:100%; display:flex; flex-direction:column;">
                        <div style="display:flex; justify-content:space-between; align-items:center; background:#eee; padding:10px; border-radius:4px;">
                            <h3 style="margin:0;">📋 প্রশ্নের তালিকা (Preview)</h3>
                            <span id="total-q-count" style="background:#333; color:white; padding:2px 8px; border-radius:10px; font-size:12px;">0</span>
                        </div>
                        
                        <div id="questions-container"></div>
                        
                        <div class="save-section" style="margin-top:10px; background:white; padding:10px;">
                            <div id="share-link-box" style="display:none; background:#e8f5e9; padding:10px; border-radius:4px;">
                                <input type="text" id="generated-link" readonly style="font-size:12px; width:100%;">
                                <button onclick="copyLink()" style="background:#2e7d32; color:white; padding:5px 10px; width:100%; margin-top:5px;">Copy Link</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div id="view-results" style="display:none;">
            <button onclick="showDashboard()" class="secondary-btn" style="margin-bottom:15px;">← Back to Dashboard</button>
            <h2>📊 রেজাল্ট: <span id="res-quiz-title"></span></h2>
            <div class="table-responsive">
                <table class="res-table" style="width:100%; border-collapse:collapse;">
                    <thead>
                        <tr style="background:#f0f0f0; text-align:left;">
                            <th style="padding:10px;">Student Name</th>
                            <th style="padding:10px;">Score</th>
                            <th style="padding:10px;">Date</th>
                        </tr>
                    </thead>
                    <tbody id="results-body"></tbody>
                </table>
            </div>
        </div>

    </div>

    <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-storage.js"></script>
    
    <script src="admin.js"></script>
</body>
</html>
